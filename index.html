</button>

<!-- Auth Section -->

<img id="user-avatar" src="" alt="User" class="w-9 h-9 rounded-full object-cover ring-2 ring-brand-500">

</div>
</div>
</div>

<!-- Main Dashboard Container -->
<main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full grid grid-cols-1 lg:grid-cols-3 gap-8">

<!-- Left Column: Post a Task Form -->
<div class="space-y-6 lg:col-span-1">
<section class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700">
<h2 id="form-heading" class="text-lg font-bold text-gray-900 dark:text-white mb-4 flex items-center space-x-2">
<i class="fa-solid fa-circle-plus text-brand-600"></i>
<span>Post a New Task</span>
</h2>
<form id="task-form" onsubmit="handleAddTask(event)" class="space-y-4">
<div>
<label id="lbl-title" class="block text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-1.5">Task Title / Service</label>
<input type="text" id="task-title" required placeholder="e.g., Electrician & Plumber maintenance" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none transition">
</div>
<div>
<label id="lbl-cat" class="block text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-1.5">Category</label>
<select id="task-category" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none transition">
<option value="Electrical">Electrical & Wiring</option>
<option value="Plumbing">Plumbing & Repairs</option>
<option value="Technology">IT & Software</option>
<option value="General">General Maintenance</option>
</select>
</div>
<div>
<label id="lbl-loc" class="block text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-1.5">Location / Area</label>
<input type="text" id="task-location" required placeholder="e.g., Al Ruwais, Abu Dhabi" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none transition">
</div>
<div>
<label id="lbl-phone" class="block text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-1.5">WhatsApp / Phone Number</label>
<input type="text" id="task-phone" required placeholder="+971 50 XXXXXXX" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none transition">
</div>
<div class="grid grid-cols-2 gap-3">
<div>
<label id="lbl-paymethod" class="block text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-1.5">Payment Method</label>
<select id="payment-method" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white text-xs focus:ring-2 focus:ring-brand-500 focus:outline-none transition">
<option value="bKash">bKash</option>
<option value="Nagad">Nagad</option>
<option value="Rocket">Rocket</option>
<option value="Cash/Direct">Cash / Direct</option>
</select>
</div>
<div>
<label id="lbl-paynum" class="block text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-1.5">Account / Number</label>
<input type="text" id="payment-number" required placeholder="017XXXXXXXX" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white text-xs focus:ring-2 focus:ring-brand-500 focus:outline-none transition">
</div>
</div>
<div>
<label id="lbl-desc" class="block text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-1.5">Description</label>
<textarea id="task-desc" required rows="3" placeholder="Provide task specifications..." class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none transition"></textarea>
</div>
<button type="submit" id="btn-publish" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-brand-500/20 text-sm flex items-center justify-center space-x-2">
<i class="fa-solid fa-paper-plane"></i>
<span>Publish Elite Task</span>
</button>
</form>
</section>
</div>

<!-- Right Column: Marketplace Feed with Advanced Search & Filter -->
<section class="lg:col-span-2 space-y-6">
<!-- Search & Filter Controls -->
<div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 flex flex-col sm:flex-row gap-4 justify-between items-center">
<div class="relative w-full sm:w-72">
<i class="fa-solid fa-search absolute left-3.5 top-3 text-gray-400 text-sm"></i>
<input type="text" id="search-input" oninput="filterTasks()" placeholder="Search title or location..." class="w-full pl-10 pr-4 py-2 rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
</div>
<div class="flex items-center space-x-2 w-full sm:w-auto overflow-x-auto pb-1 sm:pb-0">
<button onclick="filterCategory('All')" class="cat-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-brand-600 text-white transition" data-cat="All">All</button>
<button onclick="filterCategory('Electrical')" class="cat-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 transition" data-cat="Electrical">Electrical</button>
<button onclick="filterCategory('Plumbing')" class="cat-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 transition" data-cat="Plumbing">Plumbing</button>
<button onclick="filterCategory('Technology')" class="cat-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 transition" data-cat="Technology">Tech</button>
</div>
</div>

<!-- Feed Header -->
<div class="flex justify-between items-center px-1">
<h2 id="feed-heading" class="text-xl font-bold text-gray-900 dark:text-white flex items-center space-x-2">
<i class="fa-solid fa-list-check text-brand-600"></i>
<span>Available Marketplace Tasks</span>
</h2>
<span id="task-count" class="bg-brand-50 dark:bg-brand-900/30 text-brand-600 dark:text-brand-400 text-xs font-bold px-3 py-1 rounded-full border border-brand-100 dark:border-brand-800">0 Tasks</span>
</div>

<!-- Task List Container -->
<div id="tasks-container" class="space-y-4">
<div class="text-center py-16 text-gray-400 bg-white dark:bg-gray-800 rounded-2xl border border-gray-100 dark:border-gray-700">
<i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-brand-600"></i>
<p class="text-sm">Synchronizing secure database...</p>
</div>
</div>
</section>
</main>

<!-- Footer -->
<footer class="bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 py-4 text-center text-xs text-gray-500 dark:text-gray-400">
&copy; 2026 TASKY Ecosystem. Secured with Firebase Production Rules & App Check.
</footer>

<!-- Firebase SDK Scripts -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, query, orderBy, deleteDoc, doc, updateDoc, arrayUnion, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyCrDNpRQXFEOahpyDA_jxTmI5N5nC3KdRg",
authDomain: "tasky-b8e5b.firebaseapp.com",
projectId: "tasky-b8e5b",
storageBucket: "tasky-b8e5b.firebasestorage.app",
messagingSenderId: "27035947125",
appId: "1:27035947125:web:dc66829cb61eded04ea83c",
measurementId: "G-TEBQZKPRSQ"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

let currentUser = null;
let allTasks = [];
let currentCategory = 'All';
let currentLang = 'en';

// Translations Dictionary
const translations = {
  en: {
    appSubtitle: "Elite Professional Marketplace",
    loginText: "Sign in with Google",
    formHeading: "Post a New Task",
    lblTitle: "Task Title / Service",
    lblCat: "Category",
    lblLoc: "Location / Area",
    lblPhone: "WhatsApp / Phone Number",
    lblPayMethod: "Payment Method",
    lblPayNum: "Account / Number",
    lblDesc: "Description",
    btnPublish: "Publish Elite Task",
    feedHeading: "Available Marketplace Tasks",
    searchPlaceholder: "Search title or location...",
    chatWhatsapp: "Chat on WhatsApp",
    reviewHeading: "Client Ratings & Reviews",
    submitReview: "Submit Review"
  },
  bn: {
    appSubtitle: "এলিট প্রফেশনাল মার্কেটপ্লেস",
    loginText: "গুগল দিয়ে সাইন ইন করুন",
    formHeading: "নতুন কাজ পোস্ট করুন",
    lblTitle: "কাজের শিরোনাম / সার্ভিস",
    lblCat: "ক্যাটাগরি",
    lblLoc: "লোকেশন / এলাকা",
    lblPhone: "হোয়াটসঅ্যাপ / ফোন নম্বর",
    lblPayMethod: "পেমেন্ট মাধ্যম",
    lblPayNum: "অ্যাকাউন্ট / নম্বর",
    lblDesc: "বিস্তারিত বিবরণ",
    btnPublish: "টাস্ক পাবলিশ করুন",
    feedHeading: "মার্কেটপ্লেসের উপলব্ধ কাজসমূহ",
    searchPlaceholder: "কাজের নাম বা লোকেশন খুঁজুন...",
    chatWhatsapp: "হোয়াটসঅ্যাপে চ্যাট করুন",
    reviewHeading: "রেটিং ও রিভিউ",
    submitReview: "রিভিউ জমা দিন"
  }
};

window.toggleLanguage = function() {
  currentLang = currentLang === 'en' ? 'bn' : 'en';
  document.getElementById('lang-btn-text').textContent = currentLang === 'en' ? 'বাংলা' : 'English';
  
  const t = translations[currentLang];
  document.getElementById('app-subtitle').textContent = t.appSubtitle;
  document.getElementById('login-text').textContent = t.loginText;
  document.getElementById('form-heading').innerHTML = `<i class="fa-solid fa-circle-plus text-brand-600"></i><span>${t.formHeading}</span>`;
  document.getElementById('lbl-title').textContent = t.lblTitle;
  document.getElementById('lbl-cat').textContent = t.lblCat;
  document.getElementById('lbl-loc').textContent = t.lblLoc;
  document.getElementById('lbl-phone').textContent = t.lblPhone;
  document.getElementById('lbl-paymethod').textContent = t.lblPayMethod;
  document.getElementById('lbl-paynum').textContent = t.lblPayNum;
  document.getElementById('lbl-desc').textContent = t.lblDesc;
  document.getElementById('btn-publish').innerHTML = `<i class="fa-solid fa-paper-plane"></i><span>${t.btnPublish}</span>`;
  document.getElementById('feed-heading').innerHTML = `<i class="fa-solid fa-list-check text-brand-600"></i><span>${t.feedHeading}</span>`;
  document.getElementById('search-input').placeholder = t.searchPlaceholder;
  
  renderTasks(allTasks);
};

// Dark Mode Logic
window.toggleDarkMode = function() {
const html = document.documentElement;
const icon = document.getElementById('theme-icon');
if (html.classList.contains('dark')) {
html.classList.remove('dark');
icon.className = "fa-solid fa-moon";
localStorage.setItem('theme', 'light');
} else {
html.classList.add('dark');
icon.className = "fa-solid fa-sun";
localStorage.setItem('theme', 'dark');
}
};

if (localStorage.getItem('theme') === 'dark') {
document.documentElement.classList.add('dark');
document.getElementById('theme-icon').className = "fa-solid fa-sun";
}

// Auth State Observer
onAuthStateChanged(auth, (user) => {
currentUser = user;
const loginBtn = document.getElementById('login-btn');
const userProfile = document.getElementById('user-profile');
const userAvatar = document.getElementById('user-avatar');
const userName = document.getElementById('user-name');

if (user) {
loginBtn.classList.add('hidden');
userProfile.classList.remove('hidden');
userAvatar.src = user.photoURL || 'https://via.placeholder.com/150';
userName.textContent = user.displayName;
} else {
loginBtn.classList.remove('hidden');
userProfile.classList.add('hidden');
}
loadTasks();
});

window.loginWithGoogle = async function() {
try {
await signInWithPopup(auth, provider);
} catch (error) {
console.error("Login Error:", error);
alert("Google sign-in failed. Please ensure your domain is authorized in Firebase console.");
}
};

window.logout = async function() {
try {
await signOut(auth);
} catch (error) {
console.error("Logout Error:", error);
}
};

window.handleAddTask = async function(e) {
e.preventDefault();
if (!currentUser) {
alert("Please sign in with Google to post a task!");
return;
}

const title = document.getElementById('task-title').value;
const category = document.getElementById('task-category').value;
const location = document.getElementById('task-location').value;
const phone = document.getElementById('task-phone').value;
const paymentMethod = document.getElementById('payment-method').value;
const paymentNumber = document.getElementById('payment-number').value;
const description = document.getElementById('task-desc').value;

try {
await addDoc(collection(db, "tasks"), {
title,
category,
location,
phone,
paymentMethod,
paymentNumber,
description,
reviews: [],
authorName: currentUser.displayName,
authorEmail: currentUser.email,
authorPhoto: currentUser.photoURL,
createdAt: serverTimestamp()
});

document.getElementById('task-form').reset();
loadTasks();
alert("Task Published Successfully!");
} catch (error) {
console.error("Error adding task:", error);
alert("Failed to post task due to security rules or network issue.");
}
};

async function loadTasks() {
try {
const q = query(collection(db, "tasks"), orderBy("createdAt", "desc"));
const querySnapshot = await getDocs(q);

allTasks = [];
querySnapshot.forEach((docSnap) => {
allTasks.push({ id: docSnap.id, ...docSnap.data() });
});

renderTasks(allTasks);
} catch (error) {
console.error("Error loading tasks:", error);
document.getElementById('tasks-container').innerHTML = `<div class="bg-white dark:bg-gray-800 p-8 rounded-2xl text-center text-red-500 border border-gray-100 dark:border-gray-700 text-sm">Failed to load tasks. Verify Firestore rules.</div>`;
}
}

window.filterCategory = function(cat) {
currentCategory = cat;
document.querySelectorAll('.cat-btn').forEach(btn => {
if (btn.dataset.cat === cat) {
btn.className = "cat-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-brand-600 text-white transition";
} else {
btn.className = "cat-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 transition";
}
});
filterTasks();
};

window.filterTasks = function() {
const searchTerm = document.getElementById('search-input').value.toLowerCase();
const filtered = allTasks.filter(task => {
const matchesCat = (currentCategory === 'All' || task.category === currentCategory);
const matchesSearch = task.title.toLowerCase().includes(searchTerm) || task.description.toLowerCase().includes(searchTerm) || (task.location && task.location.toLowerCase().includes(searchTerm));
return matchesCat && matchesSearch;
});
renderTasks(filtered);
};

function renderTasks(tasksToRender) {
const container = document.getElementById('tasks-container');
const countBadge = document.getElementById('task-count');
const t = translations[currentLang];

container.innerHTML = "";
countBadge.textContent = `${tasksToRender.length} Task${tasksToRender.length !== 1 ? 's' : ''}`;

if (tasksToRender.length === 0) {
container.innerHTML = `<div class="bg-white dark:bg-gray-800 p-12 rounded-2xl text-center text-gray-400 border border-gray-100 dark:border-gray-700 text-sm">No tasks found matching your criteria.</div>`;
return;
}

tasksToRender.forEach((task) => {
const isOwner = currentUser && currentUser.email === task.authorEmail;
const card = document.createElement('div');
card.className = "bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 hover:shadow-md transition relative group";
  
// Reviews HTML rendering
let reviewsHtml = '';
if (task.reviews && task.reviews.length > 0) {
  task.reviews.forEach(rev => {
    reviewsHtml += `<div class="text-[11px] bg-gray-100 dark:bg-gray-900 p-2 rounded-lg mb-1 flex justify-between items-center"><span class="text-gray-700 dark:text-gray-300"><strong>${escapeHtml(rev.name)}:</strong> ${escapeHtml(rev.comment)}</span><span class="text-yellow-500 font-bold">${'★'.repeat(rev.rating)}</span></div>`;
  });
}

card.innerHTML = `
<div class="flex justify-between items-start mb-3">
<div>
<span class="bg-brand-50 dark:bg-brand-900/40 text-brand-600 dark:text-brand-400 text-[10px] font-bold px-2.5 py-1 rounded-md uppercase tracking-wider">${escapeHtml(task.category || 'General')}</span>
<h3 class="text-base font-bold text-gray-900 dark:text-white mt-2">${escapeHtml(task.title)}</h3>
</div>
<span class="bg-emerald-50 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-400 text-xs font-bold px-3 py-1 rounded-xl border border-emerald-200 dark:border-emerald-800/50">${escapeHtml(task.paymentMethod || 'bKash')}: ${escapeHtml(task.paymentNumber || '')}</span>
</div>
<p class="text-gray-600 dark:text-gray-300 text-sm mb-4 leading-relaxed">${escapeHtml(task.description)}</p>

<!-- Elite Location & Direct WhatsApp Contact Bar -->
<div class="flex flex-wrap items-center justify-between gap-3 text-xs text-gray-500 dark:text-gray-400 mb-4 bg-gray-50 dark:bg-gray-900/50 p-3 rounded-xl border border-gray-100 dark:border-gray-700/50">
<div class="flex items-center space-x-1.5">
<i class="fa-solid fa-location-dot text-brand-500"></i>
<span class="font-medium">${escapeHtml(task.location || 'Not Specified')}</span>
</div>
${task.phone ? `
<a href="https://wa.me/${escapeHtml(task.phone.replace(/[^0-9]/g, ''))}" target="_blank" class="bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-1.5 rounded-lg font-semibold flex items-center space-x-1.5 shadow-sm transition">
<i class="fa-brands fa-whatsapp text-sm"></i>
<span>${t.chatWhatsapp}</span>
</a>
` : ''}
</div>

<!-- Reviews Section -->
<div class="mb-4 border-t border-gray-100 dark:border-gray-700/60 pt-3">
<p class="text-xs font-bold text-gray-700 dark:text-gray-300 mb-2"><i class="fa-solid fa-star text-yellow-500 mr-1"></i> ${t.reviewHeading}:</p>
<div class="space-y-1 max-h-28 overflow-y-auto mb-2">${reviewsHtml || '<p class="text-[11px] text-gray-400 italic">No reviews yet.</p>'}</div>
<form onsubmit="handleAddReview(event, '${task.id}')" class="flex gap-2 mt-2">
<input type="text" id="review-comment-${task.id}" placeholder="Write a review..." required class="flex-grow px-3 py-1.5 rounded-lg border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 text-xs text-gray-900 dark:text-white focus:outline-none">
<select id="review-rating-${task.id}" class="px-2 py-1.5 rounded-lg border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 text-xs text-gray-900 dark:text-white">
<option value="5">5 ★</option>
<option value="4">4 ★</option>
<option value="3">3 ★</option>
<option value="2">2 ★</option>
<option value="1">1 ★</option>
</select>
<button type="submit" class="bg-brand-600 hover:bg-brand-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition">${t.submitReview}</button>
</form>
</div>

<div class="flex items-center justify-between text-xs text-gray-500 dark:text-gray-400 border-t border-gray-100 dark:border-gray-700/60 pt-4">
<div class="flex items-center space-x-2.5">
<img src="${task.authorPhoto || 'https://via.placeholder.com/150'}" class="w-7 h-7 rounded-full object-cover">
<span class="font-medium text-gray-700 dark:text-gray-300">${escapeHtml(task.authorName)}</span>
</div>
<div class="flex items-center space-x-3">
<span>${task.createdAt ? new Date(task.createdAt.seconds * 1000).toLocaleDateString() : 'Just now'}</span>
${isOwner ? `<button onclick="deleteTask('${task.id}')" class="text-red-500 hover:text-red-700 transition p-1" title="Delete Task"><i class="fa-solid fa-trash-can"></i></button>` : ''}
</div>
</div>
`;
container.appendChild(card);
});
}

window.handleAddReview = async function(e, taskId) {
e.preventDefault();
if (!currentUser) {
alert("Please sign in to submit a review!");
return;
}

const comment = document.getElementById(`review-comment-${taskId}`).value;
const rating = Number(document.getElementById(`review-rating-${taskId}`).value);

try {
const taskRef = doc(db, "tasks", taskId);
await updateDoc(taskRef, {
reviews: arrayUnion({
name: currentUser.displayName,
comment: comment,
rating: rating,
time: new Date().toISOString()
})
});
loadTasks();
} catch (error) {
console.error("Error adding review:", error);
alert("Failed to submit review.");
}
};

window.deleteTask = async function(taskId) {
if (confirm("Are you sure you want to delete this task?")) {
try {
await deleteDoc(doc(db, "tasks", taskId));
loadTasks();
} catch (error) {
console.error("Error deleting task:", error);
alert("Unauthorized to delete this task.");
}
}
};

function escapeHtml(str) {
return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}
</script>
</body>
</html>
