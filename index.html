<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TASKY - Modern Task Management & Service Marketplace Ecosystem</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
    <div class="max-w-md mx-auto p-4 space-y-6">
        <!-- Header Section -->
        <header class="flex items-center justify-between bg-white p-4 rounded-xl shadow-sm">
            <div class="flex items-center space-x-2">
                <div class="bg-indigo-600 text-white p-2 rounded-lg font-bold">T</div>
                <div>
                    <h1 class="font-bold text-lg">TASKY</h1>
                    <p class="text-xs text-slate-500">Secure Marketplace</p>
                </div>
            </div>
            <button id="google-login-btn" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 transition">
                Sign in with Google
            </button>
        </header>

        <!-- Post a New Task Section -->
        <section class="bg-white p-5 rounded-2xl shadow-sm space-y-4">
            <h2 class="font-bold text-lg flex items-center gap-2">
                <span class="bg-indigo-100 text-indigo-600 p-1 rounded-full text-xs">+</span> Post a New Task
            </h2>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Task Title / Service</label>
                    <input type="text" id="task-title" placeholder="e.g., Electrical Wiring & Maintenance" class="w-full border border-slate-200 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Category</label>
                    <select id="task-category" class="w-full border border-slate-200 rounded-lg p-2.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option>Electrical & Wiring</option>
                        <option>Plumbing & Maintenance</option>
                        <option>Tech Support</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Description</label>
                    <textarea id="task-desc" rows="3" placeholder="Provide task specifications..." class="w-full border border-slate-200 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Budget ($)</label>
                    <input type="number" id="task-budget" value="100" class="w-full border border-slate-200 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <button id="publish-btn" class="w-full bg-indigo-600 text-white font-medium py-2.5 rounded-xl hover:bg-indigo-700 transition">
                    Publish Task
                </button>
            </div>
        </section>

        <!-- Marketplace Tasks -->
        <section class="space-y-3">
            <h2 class="font-bold text-lg">Available Marketplace Tasks</h2>
            <div id="tasks-container" class="space-y-3">
                <div class="text-sm text-slate-500">Loading tasks...</div>
            </div>
        </section>
    </div>

    <!-- Firebase SDK & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "tasky-b8e5b.firebaseapp.com",
            projectId: "tasky-b8e5b",
            storageBucket: "tasky-b8e5b.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;

        // Auth state listener
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            const loginBtn = document.getElementById('google-login-btn');
            if (user) {
                loginBtn.textContent = user.displayName ? `Hi, ${user.displayName.split(' ')[0]}` : 'Logged In';
                loginBtn.classList.remove('bg-indigo-600', 'hover:bg-indigo-700');
                loginBtn.classList.add('bg-emerald-600');
            } else {
                loginBtn.textContent = 'Sign in with Google';
                loginBtn.classList.add('bg-indigo-600', 'hover:bg-indigo-700');
                loginBtn.classList.remove('bg-emerald-600');
            }
        });

        // Google Login Button
        document.getElementById('google-login-btn').addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, provider);
                alert('Successfully Logged In!');
            } catch (error) {
                console.error(error);
                alert('Login Failed: ' + error.message);
            }
        });

        // Publish Task Button
        document.getElementById('publish-btn').addEventListener('click', async () => {
            if (!currentUser) {
                alert('Please sign in with Google to post a task!');
                return;
            }

            const title = document.getElementById('task-title').value;
            const category = document.getElementById('task-category').value;
            const description = document.getElementById('task-desc').value;
            const budget = document.getElementById('task-budget').value;

            if (!title) {
                alert('Please enter a task title!');
                return;
            }

            try {
                await addDoc(collection(db, "tasks"), {
                    title,
                    category,
                    description,
                    budget: Number(budget),
                    userEmail: currentUser.email,
                    createdAt: new Date()
                });
                alert('Task Published Successfully!');
                // Reset form
                document.getElementById('task-title').value = '';
                document.getElementById('task-desc').value = '';
                loadTasks();
            } catch (error) {
                console.error(error);
                alert('Error publishing task: ' + error.message);
            }
        });

        // Load Tasks from Firestore
        async function loadTasks() {
            const container = document.getElementById('tasks-container');
            try {
                const q = query(collection(db, "tasks"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    container.innerHTML = '<div class="text-sm text-slate-500">0 Tasks found. Post your first task above!</div>';
                    return;
                }

                let html = '';
                querySnapshot.forEach((doc) => {
                    const task = doc.data();
                    html += `
                        <div class="bg-white p-4 rounded-xl shadow-sm space-y-2 border border-slate-100">
                            <div class="flex justify-between items-start">
                                <h3 class="font-bold text-sm text-slate-800">${task.title}</h3>
                                <span class="bg-indigo-50 text-indigo-600 text-xs px-2 py-0.5 rounded-full font-medium">${task.category}</span>
                            </div>
                            <p class="text-xs text-slate-600">${task.description || 'No description'}</p>
                            <div class="flex justify-between items-center pt-2 text-xs text-slate-500 font-semibold">
                                <span class="text-emerald-600">Budget: $${task.budget}</span>
                                <span>By: ${task.userEmail ? task.userEmail.split('@')[0] : 'User'}</span>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (error) {
                console.error(error);
                container.innerHTML = '<div class="text-sm text-red-500">Error loading tasks.</div>';
            }
        }

        loadTasks();
    </script>
</body>
</html>
